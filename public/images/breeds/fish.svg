<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" fill="none" role="img" aria-hidden="true">
  <defs>
    <pattern id="fish-h1" width="3.5" height="3.5" patternUnits="userSpaceOnUse" patternTransform="rotate(34)">
      <line x1="0" y1="0" x2="0" y2="3.5" stroke="#17382C" stroke-width="0.95" stroke-opacity="0.75"/>
    </pattern>
    <pattern id="fish-h2" width="3" height="3" patternUnits="userSpaceOnUse" patternTransform="rotate(-32)">
      <line x1="0" y1="0" x2="0" y2="3" stroke="#17382C" stroke-width="1.1" stroke-opacity="0.9"/>
      <line x1="0" y1="0" x2="3" y2="0" stroke="#17382C" stroke-width="0.7" stroke-opacity="0.65"/>
    </pattern>
    <pattern id="fish-scales" width="12" height="12" patternUnits="userSpaceOnUse">
      <path d="M0 6 C3.5 1.5 8.5 1.5 12 6 M-6 12 C-2.5 7.5 2.5 7.5 6 12 M6 12 C9.5 7.5 14.5 7.5 18 12" stroke="#17382C" stroke-width="1.2" stroke-opacity="0.9" fill="none"/>
    </pattern>
  </defs>

  <!-- Dorsal fin -->
  <path d="M148 156 C162 112 202 100 248 110 C256 124 252 146 244 162 Z" fill="url(#fish-h1)" stroke="#17382C" stroke-width="2" stroke-linejoin="round"/>
