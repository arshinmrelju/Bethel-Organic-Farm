  <path d="M116 214 C138 210 162 222 168 244 C150 252 128 244 116 226 Z" fill="url(#fish-h1)"/>
  <path d="M120 218 L158 232 M120 222 L156 238 M120 226 L148 243" stroke="#17382C" stroke-width="1.1"/>
