  <path d="M158 246 L168 272 M166 246 L178 274 M174 246 L186 272" stroke="#17382C" stroke-width="1"/>

  <!-- Caudal (tail) fin -->
  <path d="M286 184 C314 162 342 140 364 138 C350 164 344 184 342 200 C344 218 352 240 364 262 C340 260 314 238 286 214 Z" fill="url(#fish-h1)" stroke="#17382C" stroke-width="2" stroke-linejoin="round"/>
  <path d="M294 186 L358 144 M294 190 L352 156 M294 194 L346 170 M294 198 L342 184 M294 202 L342 198 M294 206 L344 212 M294 210 L348 228 M294 213 L354 244 M294 215 L360 256" stroke="#17382C" stroke-width="1.05" stroke-linecap="round"/>

  <!-- Main fish body -->
