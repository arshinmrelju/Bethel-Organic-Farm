  <!-- Gill plate & head engraving -->
  <path d="M112 154 C128 180 128 220 112 244" stroke="#17382C" stroke-width="2.1" stroke-linecap="round"/>
  <path d="M98 162 C112 184 112 216 98 238" stroke="#17382C" stroke-width="1.4" stroke-linecap="round"/>
  <path d="M48 188 C68 164 94 156 116 156 C122 174 122 190 116 202 C92 198 68 194 48 188 Z" fill="url(#fish-h2)" opacity="0.7"/>
  <path d="M56 212 C74 224 94 232 114 234 L112 216 C92 216 74 214 56 212 Z" fill="url(#fish-h1)"/>

  <!-- Eye, mouth & barbels -->
  <circle cx="76" cy="189" r="11" fill="#FFFFFF" stroke="#17382C" stroke-width="2"/>
  <circle cx="76" cy="189" r="6.5" fill="#17382C"/>
  <circle cx="73.5" cy="186.5" r="2.2" fill="#FFFFFF"/>
