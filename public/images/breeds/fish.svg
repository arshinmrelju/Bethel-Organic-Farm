  <path d="M108 158 C154 146 218 152 290 187 L290 202 C226 194 162 194 112 188 Z" fill="url(#fish-h2)"/>
  <path d="M116 156 C166 148 226 158 286 188 L286 212 C226 242 166 250 116 242 C128 214 128 184 116 156 Z" fill="url(#fish-scales)"/>
  <!-- Belly contour hatching -->
  <path d="M116 226 C160 244 218 244 282 214 C252 238 206 250 156 248 C136 246 124 238 116 226 Z" fill="url(#fish-h1)"/>

  <!-- Lateral line -->
